# gVisor NodePool — standalone from the cluster's default NodePool so
# the gVisor containerd shim install doesn't affect general workloads.
#
# Two resources here:
#   1. EC2NodeClass — AL2023 AMI with user-data that installs the
#      gVisor `runsc` shim, writes the containerd plugin config, and
#      restarts containerd. AL2023 over Bottlerocket because the shim
#      install scripts upstream target AL2023 systemd + dnf today.
#   2. NodePool — matches any pod requesting `runtimeClassName: gvisor`
#      via the label selector, applies a matching taint so runc-only
#      workloads don't accidentally land on gVisor nodes, and caps
#      the node count to prevent runaway provisioning.
#
# Node label `agent-sandbox/runtime=gvisor` is referenced by the
# RuntimeClass scheduling block in runtimeclass-gvisor.yaml.
#
# gVisor version: pinned by GVISOR_RELEASE at the top of the user-data
# script below (a dated directory under
# https://storage.googleapis.com/gvisor/releases/release/). To bump it,
# pick a newer dated release that has gvisor.tar.zstd and
# gvisor.tar.zstd.sha512 for both x86_64 and aarch64.
#
# Requires Cilium (enable_cilium = true, this blueprint's Standard EKS
# default): the NodePool declares Cilium's agent-not-ready startup taint.
# Remove the startupTaints block if Cilium is not installed, or gVisor
# nodes never become schedulable.
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: agent-sandbox-gvisor
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  # Resolved by install.sh sed — we look up the actual role name
  # from a live EC2NodeClass at render time since the ai-on-eks base
  # module appends a Terraform-generated suffix to the node role.
  # Using sed (not envsubst) because the user-data below is shell
  # script with its own $VAR references that envsubst would clobber.
  role: __KARPENTER_NODE_ROLE__
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: __CLUSTER_NAME__
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: __CLUSTER_NAME__
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
  tags:
    agent-sandbox/tier: gvisor
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    set -euxo pipefail

    # gVisor release to install: a dated directory under
    # https://storage.googleapis.com/gvisor/releases/release/ (gVisor tag
    # release-<GVISOR_RELEASE>). Bump here; the new release must have
    # gvisor.tar.zstd + gvisor.tar.zstd.sha512 for x86_64 and aarch64.
    GVISOR_RELEASE="20261005.0"

    # Install gVisor runsc binary + containerd shim from the official
    # Google release bucket, pinned to GVISOR_RELEASE (not the
    # `release/latest/` alias, which changes under you).
    #
    # gVisor releases now ship as a single tarball: runsc,
    # containerd-shim-runsc-v1 and a gvisor-bin/ directory of sidecar
    # binaries (gvisor_sentry, ...) that runsc requires next to itself
    # (/usr/local/bin/gvisor-bin/gvisor_sentry; --sidecar-usage-policy
    # defaults to STRICT). The per-binary URLs
    # (release/<version>/<arch>/runsc) return 404. Extract the whole
    # tarball into /usr/local/bin. The zstd tarball is the smaller one;
    # AL2023 ships zstd + GNU tar.
    ARCH=$(uname -m)
    URL="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/${ARCH}"
    mkdir -p /tmp/gvisor && cd /tmp/gvisor

    curl -fsSL -o gvisor.tar.zstd "${URL}/gvisor.tar.zstd"
    curl -fsSL -o gvisor.tar.zstd.sha512 "${URL}/gvisor.tar.zstd.sha512"
    sha512sum -c gvisor.tar.zstd.sha512
    tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
    chmod +x /usr/local/bin/runsc /usr/local/bin/containerd-shim-runsc-v1
    rm -f gvisor.tar.zstd gvisor.tar.zstd.sha512

    # Register runsc with containerd. AL2023 / EKS 1.34 ships with
    # containerd v2 which uses the `io.containerd.cri.v1.runtime.*`
    # plugin path — the older `io.containerd.grpc.v1.cri.*` path is
    # legacy and silently ignored. Append (rather than clobber) so
    # the base nodeadm runc registration stays intact.
    cat <<'EOT' >> /etc/containerd/config.toml

    [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runsc]
      runtime_type = "io.containerd.runsc.v1"

    [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runsc.options]
      TypeUrl = "io.containerd.runsc.v1.options"
      ConfigPath = "/etc/containerd/runsc.toml"
    EOT

    # Default gVisor runtime options — platform=kvm for hardware
    # acceleration on nested-virt-capable instances, falling back to
    # platform=ptrace on instances without nested virt. m5-class
    # instances use ptrace; c5n.metal + m5.metal + other nested-virt
    # instances would use kvm.
    cat <<'EOT' > /etc/containerd/runsc.toml
    [runsc_config]
      platform = "ptrace"
      network = "sandbox"
    EOT

    systemctl restart containerd

    --//
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          maxPods: 30
    --//
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: agent-sandbox-gvisor
spec:
  template:
    metadata:
      labels:
        agent-sandbox/runtime: gvisor
        agent-sandbox/tier: gvisor
    spec:
      # Tainted so standard-runtime workloads don't land here and
      # waste the gVisor-shim install on pods that won't use it.
      taints:
        - key: agent-sandbox/runtime
          value: gvisor
          effect: NoSchedule
      # Cilium's operator taints every new node with
      # node.cilium.io/agent-not-ready until the Cilium agent runs there.
      # Declared as a startup taint (Cilium's Karpenter guidance), so
      # Karpenter counts a registering node as capacity for the pending
      # pod. Without it Karpenter launched a new gVisor node every ~25s
      # until the first one initialized (3 nodes for 1 pod in testing).
      # REQUIRES Cilium (enable_cilium = true, the Standard EKS default of
      # this blueprint). Remove this block when Cilium is not installed:
      # nothing would clear the taint and pods would never schedule.
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoExecute
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: agent-sandbox-gvisor
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # Karpenter v1 scheduler needs label requirements to match pod
        # nodeSelectors. Without this, the template.metadata.labels
        # block above isn't visible to the requirement matcher — the
        # node will be *created* with the label but Karpenter won't
        # pick this pool when a pod requests `agent-sandbox/runtime=
        # gvisor` unless the key is also in the requirements here.
        - key: agent-sandbox/runtime
          operator: In
          values: ["gvisor"]
      expireAfter: 24h
  limits:
    cpu: 16
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
