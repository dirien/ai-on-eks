# SandboxTemplate — agent (gVisor tier).
#
# Reference-agent-shaped variant of sandbox-gvisor. Same runtime
# (gVisor's runsc), security context, and egress labels, plus what the
# reference agent needs:
#   - python:3.12-slim image
#   - sandbox-agent-sa ServiceAccount (IRSA-bound at install time)
#   - agent-script ConfigMap mount
#   - Bedrock + HOME env vars
#   - `state` volumeClaimTemplate: a 1Gi gp3 PVC (gp3 is the default
#     StorageClass created by the base module) mounted at
#     /workspace/state. Unlike the emptyDir /workspace it survives the
#     pod being deleted, so it demonstrates suspend/resume:
#       kubectl exec <sandbox> -- sh -c 'date > /workspace/state/note'
#       kubectl patch sandbox <sandbox> --type merge -p '{"spec":{"operatingMode":"Suspended"}}'
#       kubectl patch sandbox <sandbox> --type merge -p '{"spec":{"operatingMode":"Running"}}'
#       kubectl exec <sandbox> -- cat /workspace/state/note
#     The controller names the PVC state-<sandbox-name> and adds the
#     matching pod volume `state`; the container only declares the mount.
#
# Pod spec mirrors sandbox-agent-runc exactly — only runtimeClassName
# and the gVisor NodePool toleration differ.
#
# Mode compatibility:
#   - Standard EKS (Karpenter): yes — requires the gVisor RuntimeClass
#     + a NodePool with the runsc containerd shim installed.
#   - EKS Auto Mode: NO — Auto Mode workloads claim sandbox-agent-runc
#     instead.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: sandbox-agent-gvisor
  namespace: agent-sandboxes
  labels:
    agent-sandbox/tier: gvisor
    agent-sandbox/role: reference-agent
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        egress-tier: sandbox
        agent-sandbox/tier: gvisor
        agent-sandbox/role: reference-agent
    spec:
      serviceAccountName: sandbox-agent-sa
      # fsGroup makes the kubelet chown the PVC to gid 1000 so the
      # non-root agent (runAsUser 1000) can write /workspace/state.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      runtimeClassName: gvisor
      tolerations:
        - key: agent-sandbox/runtime
          operator: Equal
          value: gvisor
          effect: NoSchedule
      containers:
        - name: agent-runtime
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              cp /config/agent.py /workspace/agent.py
              chmod +x /workspace/agent.py
              echo "sandbox ready"
              echo "run: kubectl exec -n agent-sandboxes <sandbox-name> -c agent-runtime -- python /workspace/agent.py"
              sleep infinity
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: BEDROCK_MODEL_ID
              value: us.anthropic.claude-sonnet-4-5-20250929-v1:0
            - name: HOME
              value: /workspace
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: agent-script
              mountPath: /config
              readOnly: true
            # PVC from spec.volumeClaimTemplates below (persists across
            # Suspended/Running).
            - name: state
              mountPath: /workspace/state
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: agent-script
          configMap:
            name: sandbox-agent-script
            items:
              - key: agent.py
                path: agent.py
  # Per-sandbox persistent volume. The controller creates PVC
  # state-<sandbox-name> (owned by the Sandbox, so it is deleted with it)
  # and injects pod volume `state`, mounted above at /workspace/state.
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 1Gi
