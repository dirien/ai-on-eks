# Reference SandboxWarmPool + SandboxClaim — per-instance binding that
# points at one of the agent SandboxTemplates plus the per-deployment
# glue (ServiceAccount + agent-script ConfigMap).
#
# The runtime spec (image, env, securityContext, volumes) lives in the
# SandboxTemplate; the claim adds only deployment-specific bits — IRSA
# wiring on the SA and the script ConfigMap the agent reads.
#
# v1beta1 API shape (agent-sandbox v1.0+): a SandboxClaim no longer
# references a SandboxTemplate directly. Claims check out from a
# SandboxWarmPool, and the pool is what references the template. With
# replicas: 1 the pool keeps one pre-warmed sandbox (pod scheduled,
# image pulled, PVC bound) and the claim adopts it instead of
# cold-starting — near-instant binding. The pool then warms a
# replacement. An adopted sandbox keeps its pool-generated name
# (sandbox-agent-pool-xxxxx), so the pod is NOT named `sandbox-agent`;
# resolve it from the claim:
#   kubectl -n agent-sandboxes get sandboxclaim sandbox-agent \
#     -o jsonpath='{.status.sandbox.name}'
# Set replicas: 0 to go back to cold starts (the sandbox then takes the
# claim's name, `sandbox-agent`).
#
# Template selection is deferred to apply time:
#   - Standard EKS → sandboxTemplateRef.name = sandbox-agent-gvisor
#   - EKS Auto Mode → sandboxTemplateRef.name = sandbox-agent-runc
# conformance.sh renders the right value into __SANDBOX_TEMPLATE__
# before applying. Adopters can hardcode the tier that matches their
# cluster.
#
# IRSA over Pod Identity: the SA is annotated with the IRSA role at
# install time. Pod Identity is NOT used because gVisor's Sentry
# network namespace doesn't forward the link-local route to the Pod
# Identity credential endpoint at 169.254.170.23. IRSA routes through
# STS over the regular network path, which works on both runc and
# gVisor tiers.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-agent-sa
  namespace: agent-sandboxes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-agent-script
  namespace: agent-sandboxes
  labels:
    agent-sandbox/role: runtime
data:
  # Actual contents populated by install.sh / conformance.sh via
  #   kubectl create configmap --from-file=agent.py=...
  # This placeholder keeps the manifest self-contained for review.
  agent.py: "# populated by install.sh from blueprints/agent-sandbox/agent.py"
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: sandbox-agent-pool
  namespace: agent-sandboxes
  labels:
    agent-sandbox/role: runtime
spec:
  # One pre-warmed sandbox for the claim to adopt. The warm pod starts
  # before conformance.sh / install replaces the placeholder agent-script
  # ConfigMap (and before the IRSA annotation lands on the SA), so after
  # updating either, delete the adopted sandbox's pod; the controller
  # recreates it with the real agent.py and IRSA env. Its PVC
  # (/workspace/state) is kept.
  replicas: 1
  # Patched at apply time. See header comment for tier-selection rules.
  sandboxTemplateRef:
    name: __SANDBOX_TEMPLATE__
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: sandbox-agent
  namespace: agent-sandboxes
  labels:
    agent-sandbox/role: runtime
spec:
  warmPoolRef:
    name: sandbox-agent-pool
